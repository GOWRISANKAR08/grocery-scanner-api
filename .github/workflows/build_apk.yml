name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Preserve source and generate Android scaffolding
        working-directory: flutter_app
        run: |
          cp -r lib /tmp/flutter_lib_backup
          cp pubspec.yaml /tmp/flutter_pubspec_backup.yaml
          flutter create . --project-name grocery_scanner --platforms android
          rm -rf lib
          cp -r /tmp/flutter_lib_backup lib
          cp /tmp/flutter_pubspec_backup.yaml pubspec.yaml

      - name: Configure Android permissions & SDK settings
        working-directory: flutter_app
        run: python3 configure_android.py

      - name: Get Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Build Release APK
        working-directory: flutter_app
        run: flutter build apk --release

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: grocery-scanner-release-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
