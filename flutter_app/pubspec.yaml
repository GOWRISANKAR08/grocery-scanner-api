name: grocery_scanner
description: Scan grocery products for health scores, preservatives and alternatives.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  provider: ^6.1.2
  mobile_scanner: ^5.2.3
  shared_preferences: ^2.3.2
  fl_chart: ^0.69.0
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
